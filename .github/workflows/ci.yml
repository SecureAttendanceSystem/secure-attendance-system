name: CI

on:
  push:
    branches: [main, sprint]
  pull_request:
    branches: [main, sprint]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required documentation
        run: |
          test -s README.md
          test -s CONTRIBUTING.md

  frontend-checks:
    name: ${{ matrix.app }} lint and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate Next.js route types
        if: matrix.app == 'web'
        run: npx --no-install next typegen
      - name: Check TypeScript
        run: npx --no-install tsc --noEmit

  backend-checks:
    name: Backend Docker and database checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: attendance-ci
      DATABASE_URL: postgresql+psycopg://attendance:attendance_dev@db:5432/attendance
      BACKEND_PORT: '18000'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start backend and isolated PostgreSQL
        run: docker compose up --build -d
      - name: Check Python dependencies and syntax
        run: |
          docker compose exec -T backend pip check
          docker compose exec -T backend python -c "from pathlib import Path; files = [*Path('app').rglob('*.py'), *Path('alembic').rglob('*.py')]; [compile(p.read_bytes(), str(p), 'exec') for p in files]; print(f'Checked {len(files)} Python files')"
      - name: Run backend tests
        run: docker compose exec -T backend pytest -p no:cacheprovider
      - name: Check migrations and rollback on CI database
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend alembic check
          docker compose exec -T backend alembic downgrade base
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend alembic check
      - name: Verify API and database health
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:18000/health | jq -e '.status == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:18000/health/db | jq -e '.status == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:18000/openapi.json | jq -e '.paths["/health/db"] != null'
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
