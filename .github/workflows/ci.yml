name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: ${{ matrix.app }} lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Generate Next.js route types
        if: matrix.app == 'web'
        run: npx --no-install next typegen
      - run: npx --no-install tsc --noEmit

  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start backend and database
        run: docker compose up --build -d
      - name: Run tests
        run: docker compose exec -T backend pytest
      - name: Apply migrations
        run: docker compose exec -T backend alembic upgrade head
      - name: Check API can reach the database
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:18000/health/db
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
